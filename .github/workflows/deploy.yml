name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # repo 変数 CF_DEPLOY='true' のときだけ実行（未設定なら Skipped＝赤くならない）。
    # Cloudflare のシークレット（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）を
    # 設定し終えてから CF_DEPLOY='true' にする。
    if: ${{ vars.CF_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
